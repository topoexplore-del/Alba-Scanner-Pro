name: Alba — Seguimiento intradía del historial

on:
  schedule:
    # 11:05 y 14:05 ET (verano) / 10:05 y 13:05 ET (invierno): actualiza
    # fills, stops y objetivos de las alertas abiertas durante la sesión.
    - cron: '5 15,18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alba-data
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Seguimiento de alertas
        run: python scripts/track_alerts.py
        env:
          TZ: America/New_York

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/alerts_history.json
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "chore: Alba seguimiento intradía [automated]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 15
          done
          exit 1
